# Qmat Generator Configuration
# Project: Kraft Heinz Jello Natural Colors

[project]
name = "Kraft Heinz Jello Natural Color Development"
client = "Kraft Heinz"
testing_partner = "Eurofins"
project_start = "2025-01-15"

[team]
ai_analyst = "Sebastian"
ai_engineer = "Praveen"
full_stack = "Lukasz"
kraft_contacts = ["Julie Anne", "Chris Holmquist"]

[meetings]
cadence = "bi-weekly"
time = "15:30"
day = "Monday"

[suppliers]
primary_colorant = "Sensient"
testing_lab = "Eurofins"

[default_matrix]
matrix_type = "gelatin"
product_name = "Jello Dessert Mix"
ph = 4.2
protein_content_pct = 2.5
gelatin_bloom_strength = 225
gelatin_type = "porcine"
processing_temp_c = 85.0
shelf_life_days = 365
storage_temp_c = 22.0

[experiment_design]
ph_range = [3.0, 4.0, 5.0, 6.0, 7.0, 8.0]
temp_points = [4.0, 22.0, 37.0]
time_points_days = [0, 1, 7, 14, 30, 60, 90, 180, 365]
cube_size_cm = [2.0, 2.0, 2.0]
replicates = 3

[optimization]
default_strategy = "quantum"  # quantum, growth, classical
n_candidates = 10
max_colorants = 2
optimize_for = "stability"  # stability, cost, color_match

[model]
enable_quantum = true
auto_save = true
model_dir = "./qmat_jello_model"

[output]
output_dir = "./qmat_outputs"
export_json = true
export_plots = true
export_eurofins_csv = true

[safety]
max_total_colorant_pct = 1.0
require_regulatory_approval = true
check_allergens = true

[costs]
# Target cost ranges (USD/kg)
target_cost_min = 50.0
target_cost_max = 200.0
cost_premium_vs_synthetic = 1.5  # 50% premium acceptable

[stability_thresholds]
minimum_shelf_life_retention = 0.5  # 50%
warning_threshold = 0.7  # 70%
excellent_threshold = 0.9  # 90%

[colorant_preferences]
# Preferred sources (0-1 score)
prefer_water_soluble = 1.0
prefer_heat_stable = 0.9
prefer_light_stable = 0.8
prefer_low_cost = 0.6
prefer_fda_gras = 1.0

# Avoid reactivity
avoid_vitamin_c_reactive = 0.8
avoid_ph_sensitive = 0.7